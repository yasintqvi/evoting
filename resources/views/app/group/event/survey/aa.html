<!DOCTYPE html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>فرم نظرسنجی</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
        />
        <style>
            body {
                background-color: #f8f9fa;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }
            .card {
                border-radius: 10px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                margin-bottom: 20px;
                border: none;
            }
            .card-header {
                background-color: #4e73df;
                color: white;
                border-radius: 10px 10px 0 0 !important;
                padding: 15px 20px;
            }
            .question-container {
                margin-bottom: 20px;
                padding: 15px;
                border: 1px solid #e3e6f0;
                border-radius: 8px;
                background-color: white;
            }
            .option-item {
                display: flex;
                align-items: center;
                margin-bottom: 10px;
            }
            .option-item input {
                margin-left: 10px;
            }
            .btn-add-option {
                background-color: #1cc88a;
                color: white;
                border: none;
                border-radius: 5px;
                padding: 8px 15px;
                margin-top: 10px;
            }
            .btn-add-option:hover {
                background-color: #17a673;
            }
            .btn-remove-option {
                background-color: #e74a3b;
                color: white;
                border: none;
                border-radius: 5px;
                padding: 5px 10px;
                margin-right: 10px;
            }
            .btn-remove-option:hover {
                background-color: #be2617;
            }
            .hidden {
                display: none;
            }
            .form-label {
                font-weight: 600;
                color: #5a5c69;
            }
            .question-title {
                font-weight: 600;
                margin-bottom: 15px;
                color: #4e73df;
            }
        </style>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="card">
                        <div class="card-header text-center">
                            <h4>فرم ایجاد نظرسنجی</h4>
                        </div>
                        <div class="card-body">
                            <form id="pollForm">
                                <div class="row">
                                    <div class="col-12">
                                        <div class="mb-3">
                                            <label
                                                for="poll_title"
                                                class="form-label"
                                                >عنوان نظرسنجی</label
                                            >
                                            <input
                                                type="text"
                                                class="form-control"
                                                id="poll_title"
                                                placeholder="عنوان نظرسنجی را وارد کنید"
                                            />
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <div class="mb-3">
                                            <label
                                                for="election_type"
                                                class="form-label"
                                                >نوع نظرسنجی</label
                                            >
                                            <select
                                                name="type"
                                                onchange="checkElectionType(event)"
                                                id="election_type"
                                                class="form-select"
                                            >
                                                <option value="single">
                                                    تک انتخابی
                                                </option>
                                                <option value="multiple">
                                                    چند انتخابی
                                                </option>
                                            </select>
                                        </div>
                                    </div>

                                    <!-- بخش سوالات تک انتخابی -->
                                    <div
                                        id="single_choice_section"
                                        class="col-12"
                                    >
                                        <div class="question-container">
                                            <div class="question-title">
                                                سوال تک انتخابی
                                            </div>
                                            <div class="mb-3">
                                                <label
                                                    for="single_question"
                                                    class="form-label"
                                                    >متن سوال</label
                                                >
                                                <input
                                                    type="text"
                                                    class="form-control"
                                                    id="single_question"
                                                    placeholder="متن سوال را وارد کنید"
                                                />
                                            </div>
                                            <div id="single_options_container">
                                                <div class="option-item">
                                                    <button
                                                        type="button"
                                                        class="btn-remove-option"
                                                        onclick="removeOption(this, 'single')"
                                                    >
                                                        <i
                                                            class="bi bi-dash-circle"
                                                        ></i>
                                                    </button>
                                                    <input
                                                        type="text"
                                                        class="form-control"
                                                        placeholder="گزینه اول"
                                                    />
                                                    <input
                                                        type="radio"
                                                        name="single_option"
                                                        disabled
                                                    />
                                                </div>
                                                <div class="option-item">
                                                    <button
                                                        type="button"
                                                        class="btn-remove-option"
                                                        onclick="removeOption(this, 'single')"
                                                    >
                                                        <i
                                                            class="bi bi-dash-circle"
                                                        ></i>
                                                    </button>
                                                    <input
                                                        type="text"
                                                        class="form-control"
                                                        placeholder="گزینه دوم"
                                                    />
                                                    <input
                                                        type="radio"
                                                        name="single_option"
                                                        disabled
                                                    />
                                                </div>
                                            </div>
                                            <button
                                                type="button"
                                                class="btn-add-option"
                                                onclick="addOption('single')"
                                            >
                                                <i
                                                    class="bi bi-plus-circle"
                                                ></i>
                                                افزودن گزینه
                                            </button>
                                        </div>
                                    </div>

                                    <!-- بخش سوالات چند انتخابی -->
                                    <div
                                        id="multiple_choice_section"
                                        class="col-12 hidden"
                                    >
                                        <div class="question-container">
                                            <div class="question-title">
                                                سوال چند انتخابی
                                            </div>
                                            <div class="mb-3">
                                                <label
                                                    for="multiple_question"
                                                    class="form-label"
                                                    >متن سوال</label
                                                >
                                                <input
                                                    type="text"
                                                    class="form-control"
                                                    id="multiple_question"
                                                    placeholder="متن سوال را وارد کنید"
                                                />
                                            </div>
                                            <div
                                                id="multiple_options_container"
                                            >
                                                <div class="option-item">
                                                    <button
                                                        type="button"
                                                        class="btn-remove-option"
                                                        onclick="removeOption(this, 'multiple')"
                                                    >
                                                        <i
                                                            class="bi bi-dash-circle"
                                                        ></i>
                                                    </button>
                                                    <input
                                                        type="text"
                                                        class="form-control"
                                                        placeholder="گزینه اول"
                                                    />
                                                    <input
                                                        type="checkbox"
                                                        disabled
                                                    />
                                                </div>
                                                <div class="option-item">
                                                    <button
                                                        type="button"
                                                        class="btn-remove-option"
                                                        onclick="removeOption(this, 'multiple')"
                                                    >
                                                        <i
                                                            class="bi bi-dash-circle"
                                                        ></i>
                                                    </button>
                                                    <input
                                                        type="text"
                                                        class="form-control"
                                                        placeholder="گزینه دوم"
                                                    />
                                                    <input
                                                        type="checkbox"
                                                        disabled
                                                    />
                                                </div>
                                            </div>
                                            <button
                                                type="button"
                                                class="btn-add-option"
                                                onclick="addOption('multiple')"
                                            >
                                                <i
                                                    class="bi bi-plus-circle"
                                                ></i>
                                                افزودن گزینه
                                            </button>
                                        </div>
                                    </div>

                                    <div class="col-12 mt-4">
                                        <button
                                            type="submit"
                                            class="btn btn-primary w-100"
                                        >
                                            ایجاد نظرسنجی
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // تابع برای تغییر نوع نظرسنجی
            function checkElectionType(event) {
                const selectedType = event.target.value;

                if (selectedType === "single") {
                    document
                        .getElementById("single_choice_section")
                        .classList.remove("hidden");
                    document
                        .getElementById("multiple_choice_section")
                        .classList.add("hidden");
                } else if (selectedType === "multiple") {
                    document
                        .getElementById("single_choice_section")
                        .classList.add("hidden");
                    document
                        .getElementById("multiple_choice_section")
                        .classList.remove("hidden");
                }
            }

            // تابع برای افزودن گزینه جدید
            function addOption(type) {
                const container = document.getElementById(
                    `${type}_options_container`
                );
                const optionCount = container.children.length + 1;

                const optionDiv = document.createElement("div");
                optionDiv.className = "option-item";

                const removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.className = "btn-remove-option";
                removeButton.innerHTML = '<i class="bi bi-dash-circle"></i>';
                removeButton.onclick = function () {
                    removeOption(this, type);
                };

                const input = document.createElement("input");
                input.type = "text";
                input.className = "form-control";
                input.placeholder = `گزینه ${optionCount}`;

                let choiceInput;
                if (type === "single") {
                    choiceInput = document.createElement("input");
                    choiceInput.type = "radio";
                    choiceInput.name = "single_option";
                    choiceInput.disabled = true;
                } else {
                    choiceInput = document.createElement("input");
                    choiceInput.type = "checkbox";
                    choiceInput.disabled = true;
                }

                optionDiv.appendChild(removeButton);
                optionDiv.appendChild(input);
                optionDiv.appendChild(choiceInput);

                container.appendChild(optionDiv);
            }

            // تابع برای حذف گزینه
            function removeOption(button, type) {
                const container = document.getElementById(
                    `${type}_options_container`
                );
                if (container.children.length > 1) {
                    const optionItem = button.parentElement;
                    container.removeChild(optionItem);

                    // به روز رسانی شماره گزینه‌ها
                    const options =
                        container.getElementsByClassName("option-item");
                    for (let i = 0; i < options.length; i++) {
                        const input =
                            options[i].querySelector('input[type="text"]');
                        input.placeholder = `گزینه ${i + 1}`;
                    }
                } else {
                    alert("حداقل باید یک گزینه وجود داشته باشد");
                }
            }

            // مدیریت ارسال فرم
            document
                .getElementById("pollForm")
                .addEventListener("submit", function (e) {
                    e.preventDefault();

                    const pollTitle =
                        document.getElementById("poll_title").value;
                    const electionType =
                        document.getElementById("election_type").value;

                    if (!pollTitle) {
                        alert("لطفاً عنوان نظرسنجی را وارد کنید");
                        return;
                    }

                    let question,
                        options = [];

                    if (electionType === "single") {
                        question =
                            document.getElementById("single_question").value;
                        const optionInputs = document.querySelectorAll(
                            '#single_options_container input[type="text"]'
                        );

                        optionInputs.forEach((input) => {
                            if (input.value.trim()) {
                                options.push(input.value.trim());
                            }
                        });
                    } else {
                        question =
                            document.getElementById("multiple_question").value;
                        const optionInputs = document.querySelectorAll(
                            '#multiple_options_container input[type="text"]'
                        );

                        optionInputs.forEach((input) => {
                            if (input.value.trim()) {
                                options.push(input.value.trim());
                            }
                        });
                    }

                    if (!question) {
                        alert("لطفاً متن سوال را وارد کنید");
                        return;
                    }

                    if (options.length < 2) {
                        alert("حداقل باید دو گزینه وارد کنید");
                        return;
                    }

                    // در اینجا اطلاعات فرم را می‌توانید به سرور ارسال کنید
                    console.log({
                        title: pollTitle,
                        type: electionType,
                        question: question,
                        options: options,
                    });

                    alert("نظرسنجی با موفقیت ایجاد شد!");
                });
        </script>
    </body>
</html>
